# File: .github/workflows/update_data.yml
# Place this inside the 3kka/applic GitHub repository.
#
# No GitHub Repo Secrets are required for this workflow.

name: Update RRB NTPC Schedule Data

on:
  repository_dispatch:
    types: [update_data]   # Fired by the Google Apps Script onEdit webhook
  workflow_dispatch:       # Allows manual trigger from GitHub Actions UI

concurrency:
  group: "update_data"
  cancel-in-progress: true

jobs:
  compile-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write      # Required to git commit data.json back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install pandas requests

      - name: Compile data.json from Google Sheets payload
        env:
          RAW_DATA: ${{ github.event.client_payload.raw_data }}
        run: python convert.py

      - name: Commit updated data.json to repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add data.json
          # Only commit if data.json actually changed — prevents empty commits
          git diff --staged --quiet \
            && echo "No changes to data.json. Skipping commit." \
            || git commit -m "chore: sync schedule data from Google Sheets [skip ci]"
          # Retry push up to 3 times to handle any residual split-second race conditions
          for i in 1 2 3; do
            git push && break || {
              echo "Push rejected! Another edit just committed. Rebasing..."
              # Fetch the latest commits that beat us to the punch
              git pull --rebase origin main
              
              # If we had a merge conflict on data.json (since both runs modify it),
              # we just forcibly regenerate our newer version over the conflict.
              python convert.py
              git add data.json
              git commit --amend --no-edit || true
            }
            sleep $((i * 2))
          done


